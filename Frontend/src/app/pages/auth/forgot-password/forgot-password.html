<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo-badge">
        <i class="fa-solid fa-key"></i>
      </div>
      <h1>Reset Password</h1>
      <p>Enter your email to receive recovery instructions</p>
    </div>

    @if (message()) {
      <div class="alert alert-success" role="alert">
        {{ message() }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="forgotEmail">Account Email</label>
        <input id="forgotEmail" type="email" formControlName="email" placeholder="name@example.com" />
      </div>

      <button type="submit" class="btn-primary" [disabled]="form.invalid || isLoading()">
        @if (isLoading()) {
          <span>Sending email...</span>
        } @else {
          <span>Send Recovery Email</span>
        }
      </button>
    </form>

    <div class="auth-footer">
      <p>Remembered your password? <a routerLink="/login">Back to Sign In</a></p>
    </div>
  </div>
</div>
