<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo-badge">
        <i class="fa-solid fa-user-plus"></i>
      </div>
      <h1>Create Account</h1>
      <p>Join MyLibrary to start borrowing books</p>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-error" role="alert">
        {{ errorMessage() }}
      </div>
    }

    @if (successMessage()) {
      <div class="alert alert-success" role="alert">
        {{ successMessage() }}
      </div>
    }

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="regName">Full Name</label>
        <input id="regName" type="text" formControlName="user_name" placeholder="John Doe" />
      </div>

      <div class="form-group">
        <label for="regEmail">Email Address</label>
        <input id="regEmail" type="email" formControlName="user_email" placeholder="john@example.com" />
      </div>

      <div class="form-group">
        <label for="regContact">Phone Contact</label>
        <input id="regContact" type="text" formControlName="user_contact" placeholder="+91-9876543210" />
      </div>

      <div class="form-group">
        <label for="regAddress">Address</label>
        <input id="regAddress" type="text" formControlName="user_address" placeholder="123 Main St" />
      </div>

      <div class="form-group">
        <label for="regPassword">Password</label>
        <input id="regPassword" type="password" formControlName="password" placeholder="••••••••" />
      </div>

      <button type="submit" class="btn-primary" [disabled]="registerForm.invalid || isLoading()">
        @if (isLoading()) {
          <span>Creating account...</span>
        } @else {
          <span>Register Account</span>
        }
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login">Sign in</a></p>
    </div>
  </div>
</div>
