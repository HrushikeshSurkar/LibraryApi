<div class="dashboard">
  <header class="dashboard__header">
    <h1 class="dashboard__title">Library Inventory</h1>
  </header>

  <main class="dashboard__content">
    <!-- Left: Data Table -->
    <section class="dashboard__table-card">
      <table class="table">
        <thead class="table__head">
          <tr class="table__row">
            <th class="table__header">Title & Info</th>
            <th class="table__header">Author</th>
            <th class="table__header">Shelf</th>
            <th class="table__header">Copies</th>
            <th class="table__header table__header--center">Actions</th>
          </tr>
        </thead>
        <tbody class="table__body">
          @for (item of books(); track item.book_id) {
            <tr class="table__row">
              <td class="table__cell">
                <div class="table__text-primary">{{ item.book_title }}</div>
                <div class="table__text-secondary">{{ item.book_description }}</div>
              </td>
              <td class="table__cell">{{ item.book_author }}</td>
              <td class="table__cell">{{ item.book_shelf }}</td>
              <td class="table__cell">{{ item.book_total_copies }}</td>
              <td class="table__cell table__cell--actions">
                <!-- Font Awesome Edit Icon -->
                <button class="btn-icon btn-icon--edit">
                  <i class="fa-solid fa-pen"></i>
                </button>
                <!-- Font Awesome Delete Icon -->
                <button class="btn-icon btn-icon--delete" (click)="onDeleteClick(item.book_id!)">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </section>

    <!-- Right: Form -->
    <section class="dashboard__form-card">
      <form class="form" [formGroup]="bookForm">
        <h2 class="form__title">Add Book</h2>

        <div class="form__group">
          <label class="form__label">Title</label>
          <input class="form__input" type="text" placeholder="Book Title" formControlName="title" />
        </div>

        <div class="form__group">
          <label class="form__label">Author</label>
          <input
            class="form__input"
            type="text"
            placeholder="Author Name"
            formControlName="author"
          />
        </div>

        <div class="form__group">
          <label class="form__label">Description</label>
          <input
            class="form__input"
            type="text"
            placeholder="Brief summary"
            formControlName="description"
          />
        </div>

        <div class="form__group">
          <label class="form__label">Shelf</label>
          <input
            class="form__input"
            type="text"
            placeholder="e.g. Rack A-3"
            formControlName="shelf"
          />
        </div>

        <div class="form__group">
          <label class="form__label">Total Copies</label>
          <input class="form__input" type="number" placeholder="0" formControlName="copies" />
        </div>

        <button class="btn-submit" [disabled]="bookForm.invalid" (click)="saveForm()" type="button">
          Save Book
        </button>
      </form>
    </section>
  </main>
</div>
